<svg xmlns="http://www.w3.org/2000/svg" width="520" height="720" viewBox="0 0 520 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="520" height="720" fill="#f8fafc"/>
  <text x="260" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Week 1 — Traditional RAG Baseline</text>
  <text x="260" y="54" text-anchor="middle" font-size="12" fill="#64748b">naive_rag_baseline.py</text>

  <!-- boxes -->
  <g stroke="#cbd5e1" stroke-width="1.5">
    <rect x="110" y="76"  width="300" height="60" rx="10" fill="#eef2ff"/>
    <rect x="110" y="176" width="300" height="60" rx="10" fill="#ffffff"/>
    <rect x="110" y="276" width="300" height="60" rx="10" fill="#ffffff"/>
    <rect x="110" y="376" width="300" height="60" rx="10" fill="#ffffff"/>
    <rect x="110" y="476" width="300" height="52" rx="10" fill="#ffffff"/>
    <rect x="110" y="568" width="300" height="60" rx="10" fill="#eef2ff"/>
    <rect x="110" y="666" width="300" height="42" rx="10" fill="url(#hdr)" stroke="#4f46e5"/>
  </g>
  <!-- labels -->
  <g text-anchor="middle" fill="#1e293b">
    <text x="260" y="100" font-size="14" font-weight="700">Source PDFs</text>
    <text x="260" y="118" font-size="10.5" fill="#64748b">operator_manual · machine_overview</text>

    <text x="260" y="200" font-size="14" font-weight="700">Chunking</text>
    <text x="260" y="218" font-size="10.5" fill="#64748b">RecursiveCharacterTextSplitter · 500 / 50</text>

    <text x="260" y="300" font-size="14" font-weight="700">MiniLM Embeddings</text>
    <text x="260" y="318" font-size="10.5" fill="#64748b">all-MiniLM-L6-v2 (normalized)</text>

    <text x="260" y="400" font-size="14" font-weight="700">FAISS Vector Index</text>
    <text x="260" y="418" font-size="10.5" fill="#64748b">IndexFlatIP · cosine similarity</text>

    <text x="260" y="500" font-size="14" font-weight="700">Top-K Retrieval &#8226; k = 4</text>

    <text x="260" y="592" font-size="14" font-weight="700">TinyLlama-1.1B</text>
    <text x="260" y="610" font-size="10.5" fill="#64748b">stand-in for Gemma-3-1b-it</text>

    <text x="260" y="692" font-size="14" font-weight="700" fill="#ffffff">Grounded Answer</text>
  </g>
  <!-- arrows -->
  <g stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
    <line x1="260" y1="136" x2="260" y2="172"/>
    <line x1="260" y1="236" x2="260" y2="272"/>
    <line x1="260" y1="336" x2="260" y2="372"/>
    <line x1="260" y1="436" x2="260" y2="472"/>
    <line x1="260" y1="528" x2="260" y2="564"/>
    <line x1="260" y1="628" x2="260" y2="662"/>
  </g>
</svg>
